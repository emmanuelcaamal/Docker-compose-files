version: '3.1'

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: local-azurite
    restart: always
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data"
    volumes:
      - /Users/emmanuelcaamal/.databases/azurite/data:/data
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002